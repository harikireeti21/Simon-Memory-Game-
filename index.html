<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cyber Simon — Memory Protocol</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =====================================================
         AUTH PANEL
    ====================================================== -->

    <div class="auth-panel" id="authPanel">
      <div class="auth-box">
        <h2>PLAYER ACCESS</h2>

        <p id="authMessage">LOGIN OR CREATE ACCOUNT</p>

        <input
          type="text"
          id="authUsername"
          maxlength="12"
          placeholder="USERNAME"
          autocomplete="username"
        />

        <input
          type="password"
          id="authPassword"
          placeholder="PASSWORD"
          autocomplete="current-password"
        />

        <button id="loginBtn" class="auth-btn">LOGIN</button>

        <button id="registerBtn" class="auth-btn secondary">
          CREATE ACCOUNT
        </button>
      </div>
    </div>

    <!-- =====================================================
         LOGGED-IN USER PANEL
    ====================================================== -->

    <div class="user-panel" id="userPanel">
      <span id="userNameDisplay"> PLAYER </span>

      <button id="signOutBtn">SIGN OUT</button>
    </div>

    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="glow-bg"></div>

    <div class="particles" id="particles"></div>

    <!-- =====================================================
         MAIN APP
    ====================================================== -->

    <div class="app-layout">
      <!-- ===================================================
           MAIN GAME PANEL
      ==================================================== -->

      <main class="game-container">
        <header class="game-header">
          <div class="logo">
            <span class="logo-ring"></span>

            <h1>SIMON</h1>
          </div>

          <p class="subtitle">MEMORY TEST PROTOCOL</p>
        </header>

        <!-- =================================================
             HUD
        ================================================== -->

        <section class="hud">
          <div class="hud-card">
            <span class="hud-label"> ROUND </span>

            <strong id="level" class="hud-value"> 0 </strong>
          </div>

          <div class="hud-card highlight">
            <span class="hud-label"> YOUR RECORD </span>

            <strong id="highScore" class="hud-value" style="color: #38bdf8">
              0
            </strong>
          </div>
        </section>

        <!-- =================================================
             STATUS MESSAGE
        ================================================== -->

        <div class="status-wrap">
          <p id="message" class="message">Press PLAY to begin</p>
        </div>

        <!-- =================================================
             GAME BOARD
        ================================================== -->

        <div class="board-wrapper">
          <div class="game-board" id="board">
            <button class="btn red" id="red" aria-label="Red"></button>

            <button class="btn green" id="green" aria-label="Green"></button>

            <button class="btn yellow" id="yellow" aria-label="Yellow"></button>

            <button class="btn blue" id="blue" aria-label="Blue"></button>

            <div class="center-hub">
              <div class="inner-hub">
                <span class="hub-title"> SIMON </span>

                <span class="hub-sub"> GAME </span>
              </div>
            </div>
          </div>
        </div>

        <!-- =================================================
             CONTROLS
        ================================================== -->

        <div class="controls">
          <button id="startBtn" class="control-btn start-btn">
            <span> PLAY </span>
          </button>

          <button id="resetBtn" class="control-btn reset-btn">
            <span> ABORT </span>
          </button>
        </div>

        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="game-footer">
          <p>MEMORIZE • SYNCHRONIZE • EXECUTE</p>

          <p class="tip">Tip: Speed increases every few rounds</p>
        </footer>
      </main>

      <!-- ===================================================
           LEADERBOARD
      ==================================================== -->

      <aside class="leaderboard-panel">
        <div class="panel-header">
          <div class="panel-title-wrap">
            <span class="panel-icon"> 🏆 </span>

            <h2>HALL OF FAME</h2>
          </div>

          <span class="live-tag"> LIVE TOP 20 </span>
        </div>

        <p class="panel-subtitle">GLOBAL TOP MEMORY SCORE REGISTRY</p>

        <!-- =================================================
             LEADERBOARD HEADER
        ================================================== -->

        <div class="leaderboard-table-header">
          <span> RANK </span>

          <span> PLAYERS </span>

          <span> DATE </span>

          <span class="text-right"> ROUND </span>
        </div>

        <!-- =================================================
             LEADERBOARD LIST
        ================================================== -->

        <div class="leaderboard-scroll" id="leaderboardList">
          <!-- Leaderboard Rows Inserted Here Dynamically -->
        </div>
      </aside>
    </div>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script type="module" src="script.js"></script>
  </body>
</html>
